# Wilson pour Android (PLAN.md, section 9, A8) : construit l'APK à chaque changement du dossier android/ et le publie dans
# les « Releases » du dépôt. Lien fixe pour l'installer : https://github.com/timduneau-hue/wilson/releases/latest/download/wilson.apk
name: Appli Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'

      # La clé de signature n'est plus dans le dépôt (PLAN-AMELIORATIONS W6). Deux secrets du dépôt (Settings → Secrets and
      # variables → Actions) : WILSON_CLE (le mot de passe) et WILSON_KEYSTORE_B64 (le fichier wilson.keystore encodé en base64).
      # Jamais de nouvelle clé générée ici : une clé différente empêcherait de mettre à jour l'appli déjà installée.
      - name: Clé de signature
        shell: bash
        env:
          WILSON_CLE: ${{ secrets.WILSON_CLE }}
          WILSON_KEYSTORE_B64: ${{ secrets.WILSON_KEYSTORE_B64 }}
        run: |
          if [ -z "$WILSON_CLE" ] || [ -z "$WILSON_KEYSTORE_B64" ]; then
            echo "Il manque le secret WILSON_CLE ou WILSON_KEYSTORE_B64 (dépôt → Settings → Secrets and variables → Actions) : construction d'essai seulement."
            echo "SANS_CLE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$WILSON_KEYSTORE_B64" | base64 -d > android/wilson.keystore
          keytool -list -keystore android/wilson.keystore -storepass "$WILSON_CLE" -alias wilson > /dev/null             || { echo "::error::wilson.keystore décodé, mais illisible avec WILSON_CLE : vérifier les deux secrets."; exit 1; }

      - name: Construire l'APK
        shell: bash
        working-directory: android
        env:
          WILSON_CLE: ${{ secrets.WILSON_CLE }}
        run: |
          set -o pipefail
          if [ "$SANS_CLE" = "1" ]; then
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
            ls -la app/build/outputs/apk/debug/
          else
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
            cp app/build/outputs/apk/release/app-release.apk ../wilson.apk
            ls -la ../wilson.apk
          fi

      - name: Publier dans les Releases
        if: env.SANS_CLE != '1'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: android-${{ github.run_number }}
          name: Wilson pour Android (${{ github.run_number }})
          body: "Installer sur le téléphone : https://github.com/timduneau-hue/wilson/releases/latest/download/wilson.apk"
          files: wilson.apk
          make_latest: true

      - name: Secret manquant
        if: env.SANS_CLE == '1'
        run: |
          echo "::error::Construction d'essai réussie, mais rien n'est publié : il manque le secret WILSON_CLE ou WILSON_KEYSTORE_B64."
          exit 1
