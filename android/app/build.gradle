plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.duneau.wilson'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.duneau.wilson'
        minSdk 26
        targetSdk 34
        // A13 : le numéro de l'appli est celui de sa construction par GitHub (Releases « android-N ») : l'appli compare
        // le sien à la dernière publiée pour se mettre à jour toute seule.
        def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '3') as Integer
        versionCode numero
        versionName "${numero}"
    }

    // Toujours la même clé (PLAN 9, A8) : une nouvelle version s'installe par-dessus l'ancienne. La clé est créée une seule
    // fois par GitHub (secrets WILSON_KEYSTORE_B64 et WILSON_CLE du dépôt, fichier hors dépôt) : aucun mot de passe ici.
    def cle = System.getenv('WILSON_CLE')
    signingConfigs {
        wilson {
            storeFile file('../wilson.keystore')
            storePassword cle
            keyAlias 'wilson'
            keyPassword cle
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig cle ? signingConfigs.wilson : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
